name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        arch: 'win64_msvc2019_64'
        modules: 'qt5compat'

    - name: Clean and configure
      shell: pwsh
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }
        New-Item -ItemType Directory -Path build | Out-Null
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release -j 4

    - name: Create distribution
      shell: pwsh
      run: |
        if (Test-Path dist) { Remove-Item -Recurse -Force dist }
        New-Item -ItemType Directory -Path dist | Out-Null
        Copy-Item build/Release/SecurityGuardManager.exe dist/
        cd dist
        windeployqt SecurityGuardManager.exe --no-translations --no-opengl-sw --no-system-d3d-compiler
        Get-ChildItem -Filter *.qml -ErrorAction SilentlyContinue | Remove-Item -ErrorAction SilentlyContinue

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: SGMS-Enterprise-Windows
        path: dist/
        retention-days: 30

